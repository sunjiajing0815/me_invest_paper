services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    # Lets the container reach a host-side daemon (Moomoo OpenD) at
    # host.docker.internal:11111. Required on Linux (VPS); no-op on macOS/Windows
    # Docker Desktop, which provide this hostname automatically.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
