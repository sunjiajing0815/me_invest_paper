services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    # The SQLite OLTP db lives on a named volume (real ext4 in the VM), NOT the
    # ./data bind mount: SQLite journaling is unreliable on Docker Desktop bind
    # mounts and silently lost a write once (ADR-0026). Parquet bars / duckdb stay
    # on the bind mount (append-only, no journaling). Overrides SQLITE_PATH from .env.
    environment:
      - SQLITE_PATH=/app/db/investor.db
    volumes:
      - dbdata:/app/db
      - ./data:/app/data
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

volumes:
  dbdata:
