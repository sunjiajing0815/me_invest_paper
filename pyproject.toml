[project]
name = "me-invest"
version = "0.1.0"
description = "Investor assistant — Phase 0 MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "alpaca-py>=0.43.2",
    "anthropic>=0.97.0",
    "apscheduler>=3.10,<4",
    "duckdb>=1.5.2",
    "fastapi>=0.115",
    "jinja2>=3.1.6",
    "pandas>=2.2",
    # pyarrow: pandas parquet engine (used via read_parquet/to_parquet, no direct import)
    "pyarrow>=18.0",
    "pandas-ta>=0.4.71b0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # pytz: undeclared runtime req of alpaca-py (alpaca/data/requests.py imports it)
    "pytz>=2026.1.post1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
    "langgraph>=0.2,<0.3",
    "finnhub-python>=0.2",
    "claude-agent-sdk>=0.1.81,<0.2",
    # opentelemetry-api: undeclared runtime req of claude-agent-sdk (subprocess_cli imports it)
    "opentelemetry-api>=1.41.1",
    "tavily-python>=0.6,<0.7",
    "pillow>=10.4",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these files; its template predates PEP 604 unions and leaves the
# unused `sa`/`sqlmodel` imports and unsorted import block that autogenerate emits.
# Ignore only what the generator produces — every other rule still applies here, so
# hand-written migration logic is linted normally.
"migrations/versions/*.py" = [
    "UP007",   # Optional[X] / Union[X, Y] — Alembic template style
    "UP035",   # deprecated typing imports — same
    "I001",    # unsorted import block — generator output
    "F401",    # unused sa/sqlmodel imports — generator boilerplate
    "E501",    # long revision identifiers and down_revision chains
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that require live Alpaca API keys (deselect with '-m not integration')",
]
