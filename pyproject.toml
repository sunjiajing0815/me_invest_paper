[project]
name = "me-invest"
version = "0.1.0"
description = "Investor assistant — Phase 0 MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "alpaca-py>=0.43.2",
    "anthropic>=0.97.0",
    "apscheduler>=3.10,<4",
    "duckdb>=1.5.2",
    "duckdb-engine>=0.17.0",
    "fastapi>=0.115",
    "jinja2>=3.1.6",
    "pandas>=2.2",
    "pandas-ta>=0.4.71b0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pytz>=2026.1.post1",
    "pyyaml>=6.0.3",
    "rich>=13.9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
